first_year:
  - title: "Reproducible Research"
    hp: "3 HP"
    teacher: "Samuel Flores, Swedish University of Agricultural Sciences"
    summary: "Introduces reproducible bioinformatics practice, including containers, version management, pipelining, Unix, and good scientific computing habits."
    editions:
      - "In-person 28 May – 1 June 2018 at SciLifeLab, Solna"
      - "Online 11–12 and 15–17 June 2020"
      - "Online 14–18 June 2021"
      - "In-person 13–17 June 2022 at SLU Ultuna, Uppsala"
      - "In-person 29 May – 2 June 2023 at SLU Ultuna, Uppsala"
      - "In-person 27–31 May 2024 at SLU Ultuna, Uppsala"
      - "In-person 6–10 October 2025 at SLU Ultuna, Uppsala"
      - "In-person 14–18 September 2026 at SLU Ultuna, plus pre-assignments. There are hybrid help sessions 8–12 September which are optional for MedBioInfo students, and expected for GS-VMAS students"
  - title: "Statistics in Bioinformatics"
    hp: "3 HP"
    teacher: "Dirk Repsilber, Örebro University and Zelmina Lubovac, University of Skövde"
    summary: "Covers univariate and multivariate statistics, omics data analysis, and predictive biosignatures for precision medicine."
    editions:
      - "Online 19–23 October 2020"
      - "In-person 22–26 November 2021 at University of Skövde"
      - "In-person 21–25 November 2022 at Örebro University"
      - "In-person 20–24 November 2023 at Örebro University"
      - "In-person 24–28 November 2025 at Örebro University"
      - "In-person 23–27 November 2026 at Örebro University"
second_or_third_year:
  - title: "Experimental Design for High-throughput Technologies"
    hp: "3 HP"
    teacher: "Carsten Daub, Karolinska Institutet"
    summary: "Focuses on experimental design for high-throughput studies and critical evaluation of design choices in bioinformatics workflows."
    editions:
      - "In-person 3–7 September 2018 at SciLifeLab, Solna"
      - "In-person 2–6 September 2019 at SciLifeLab, Solna"
      - "In-person 25–29 October 2021 at SciLifeLab, Solna"
      - "Hybrid 19–23 and 26–30 September 2022"
      - "In-person 13–17 November 2023 at SciLifeLab, Solna"
      - "Planned: 3–7 November 2025 at SciLifeLab, Solna"
      - "Planned: 23–27 November 2026 at SciLifeLab, Solna"
  - title: "Deep Learning"
    hp: "5 HP"
    teacher: "Chun-Biu Li, Stockholm University"
    summary: "An advanced course in deep learning with MedBioInfo seats reserved for students."
    editions:
      - "Planned: onsite 8–12 June 2026"
  - title: "Computational Systems Biology"
    hp: "3–5 HP"
    teacher: "Mika Gustafsson, Linköping University"
    summary: "Introduces systems biology concepts and mathematical models for biomedical research, from small-scale to large-scale modelling."
    editions:
      - "Ran 5–8 May 2025 in Linköping"
      - "Planned: 4–8 May 2026 in Linköping"

  - title: "Career Alternatives and Your Scientific CV"
    hp: "1 HP"
    teacher: "Carsten Daub, Karolinska Institutet"
    summary: "Explores academic and industry careers, with exercises on CV writing and interviews."
    editions:
      - "Planned: first 26-27 May 2026"
